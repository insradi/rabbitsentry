[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbitsentry"
version = "0.1.0"
description = "Modular read-only AWS assessments with evidence-based local reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43,<2",
  "typer>=0.16,<1",
  "Jinja2>=3.1.6,<4",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
rabbitsentry = "rabbitsentry.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rabbitsentry = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
