name: CLI checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check --quiet .
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/rabbitsentry-0.1.0-py3-none-any.whl
      - run: rabbitsentry modules list
      - run: rabbitsentry demo --output reports/ci-demo
